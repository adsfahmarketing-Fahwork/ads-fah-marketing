name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # เวอร์ชันสาธิตของระบบ CRM (ข้อมูลตัวอย่างล้วน ไม่เชื่อมฐานข้อมูลจริง) เผยแพร่ที่ /crm-demo/
      # ขั้นตอนนี้ "ไม่ขวาง" การเผยแพร่เว็บไซต์: ถ้า build ไม่ผ่าน เว็บไซต์หลักยังถูกเผยแพร่ตามปกติ
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - name: Install CRM dependencies (optional)
        id: crm_deps
        continue-on-error: true
        working-directory: crm
        run: npm ci

      - name: Build CRM demo (optional)
        if: steps.crm_deps.outcome == 'success'
        continue-on-error: true
        working-directory: crm
        run: |
          npm run build:demo
          rm -rf ../public/crm-demo
          cp -R dist-demo ../public/crm-demo

      # ระบบ CRM จริง (เชื่อม Supabase) เผยแพร่ที่ /crm/ — ใช้เฉพาะกุญแจแบบสาธารณะ (Publishable key) ที่ออกแบบให้อยู่ในเว็บได้
      # ความปลอดภัยของข้อมูลอยู่ที่ Row Level Security ในฐานข้อมูล; 404.html ทำให้ลิงก์ตรงของ SPA ใช้งานได้บน GitHub Pages
      - name: Build CRM live app (optional)
        if: steps.crm_deps.outcome == 'success'
        continue-on-error: true
        working-directory: crm
        env:
          VITE_SUPABASE_URL: https://vumkvfjoevwqaqsmoiyp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ZFz6lFn_0CzP4wDUIjfmiQ_vsf_Evq8
        run: |
          npx vite build --base /ads-fah-marketing/crm/ --outDir dist-live
          cp dist-live/index.html dist-live/404.html
          rm -rf ../public/crm
          cp -R dist-live ../public/crm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
